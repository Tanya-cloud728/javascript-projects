<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <style>
   * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #16280e;
    font-family: Arial, sans-serif;
}

.calculator {
    width: 450px;
    padding: 45px;
    background-color: #1e541a;
    border-radius: 24px;
    box-shadow: 0 15px 35px #a1ea47;
    text-align: center;
}

.calculator h1 {
    margin-bottom: 30px;
    color: #75e764;
    font-size: 32px;
}

.calculator input {
    display: block;
    width: 100%;
    height: 55px;
    padding: 15px;
    margin-bottom: 18px;
    background-color: #111827;
    color: white;
    border: 2px solid #374151;
    border-radius: 12px;
    font-size: 16px;
}

.calculator button {
    display: block;
    width: 100%;
    height: 55px;
    margin-top: 8px;
    background-color: #b2a9c6;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.calculator button:hover {
    background-color: #2f4d07;
}

#result {
    margin-top: 30px;
    color: #c7fb9d;
    font-size: 26px;
    font-weight: bold;
}

#category {
    margin-top: 10px;
    color: #83fd2c;
    font-size: 18px;
}
</style>
</head>
<body>
    <div class="calculator">

    <h1>BMI Calculator</h1>

    <input id="height" placeholder="Height in cm">

    <input id="weight" placeholder="Weight in kg">

    <button id="calculate">Calculate BMI</button>

    <p id="result"></p>

    <p id="category"></p>

    </div>
    <script>
        let calculate=document.getElementById("calculate")
        calculate.addEventListener("click",function(){
               console.log("new page")
               let height=document.getElementById("height").value 
               height/=100
               let weight=document.getElementById("weight").value
               let BMI=weight/(height*height)
               BMI=BMI.toFixed(2)
               let result=document.getElementById("result")
               result.textContent=BMI
               let category=document.getElementById("category")
               if(BMI<18.5){
                 category.textContent="Underweight"
               }else if(BMI>=18.5 && BMI<=24.9){
                 category.textContent="Normal"
               }else if(BMI>=25 && BMI<=29.9){
                 category.textContent="Overweight"
               }else{
                  category.textContent="Obese"
               }
        });
    </script>
</body>
</html>
